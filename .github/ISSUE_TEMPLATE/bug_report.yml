name: Bug report
description: Something is broken or behaves unexpectedly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue, please do not
        file it here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the studio
        2. Choose the WiFi tab
        3. Enter an SSID containing a semicolon
        4. ...
    validations:
      required: true
  - type: input
    id: content-type
    attributes:
      label: Which content type?
      placeholder: URL, WiFi, vCard, event...
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 15, Safari on iOS 18...
    validations:
      required: true
  - type: textarea
    id: scanner
    attributes:
      label: If the code does not scan, what did you try to scan it with?
      description: >
        Decoders vary a lot. Knowing which app and phone failed — and whether
        another one succeeded — is usually the fastest route to the cause.
